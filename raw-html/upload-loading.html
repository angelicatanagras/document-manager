<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocVault — Upload Loading</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:       #0F766E;
      --primary-teal:  #14B8A6;
      --primary-light: #CCFBF1;
      --bg:            #F8FAFC;
      --card:          #FFFFFF;
      --sidebar:       #1E293B;
      --text-primary:  #1E293B;
      --text-muted:    #64748B;
      --border:        #E2E8F0;
      --slate-100:     #F1F5F9;
      --slate-400:     #94A3B8;
      --warning:       #D97706;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar (dimmed) ── */
    .sidebar {
      width: 210px; min-width: 210px;
      background: var(--sidebar);
      display: flex; flex-direction: column;
      height: 100vh; opacity: 0.4;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 20px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .logo-icon { width: 32px; height: 32px; background: var(--primary-teal); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-icon svg { width: 18px; height: 18px; }
    .logo-text { font-size: 16px; font-weight: 700; color: #F1F5F9; }
    .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #CBD5E1; font-size: 13.5px; font-weight: 500; }
    .nav-item svg { width: 16px; height: 16px; }
    .nav-item.active { background: rgba(20,184,166,0.18); color: #5EEAD4; }
    .badge { margin-left: auto; background: var(--warning); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
    .sidebar-storage { padding: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
    .storage-bar { height: 5px; background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .storage-bar-fill { height: 100%; width: 38%; background: var(--primary-teal); border-radius: 99px; }
    .storage-label { display: flex; justify-content: space-between; font-size: 12px; color: #CBD5E1; }
    .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.06); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#0F766E,#14B8A6); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
    .user-name { font-size: 13px; font-weight: 600; color: #F1F5F9; }
    .user-role { font-size: 11px; color: #94A3B8; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    .topbar { height: 52px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; opacity: 0.4; }
    .topbar-greeting { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .topbar-greeting span { color: var(--primary); }

    .bg-content { flex: 1; padding: 20px 24px; opacity: 0.25; overflow: hidden; }
    .bg-zone { border: 2px dashed var(--primary-teal); border-radius: 12px; background: var(--primary-light); height: 155px; }

    /* ── Dark overlay ── */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(15,23,42,0.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      backdrop-filter: blur(3px);
    }

    /* ── Loading modal ── */
    .modal {
      width: 340px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* Header */
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 14px; border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .close-btn-disabled {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--slate-100);
      display: flex; align-items: center; justify-content: center;
      opacity: 0.4; cursor: not-allowed;
    }
    .close-btn-disabled svg { width: 14px; height: 14px; color: var(--text-muted); }

    /* Body */
    .modal-body {
      padding: 32px 20px 28px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }

    /* Spinner ring */
    .spinner-wrap { position: relative; width: 72px; height: 72px; }

    .spinner-track {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 5px solid var(--primary-light);
    }

    /* Static "frozen mid-spin" arc to represent loading — 75% filled */
    .spinner-arc {
      position: absolute;
      inset: 0;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 5px solid transparent;
      border-top-color: var(--primary-teal);
      border-right-color: var(--primary-teal);
      border-bottom-color: var(--primary-teal);
      transform: rotate(-30deg);
    }

    /* Pulsing file icon in centre */
    .spinner-icon {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .spinner-icon svg { width: 22px; height: 22px; color: var(--primary); }

    /* Progress info */
    .loading-info { text-align: center; }
    .loading-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .loading-sub { font-size: 13px; color: var(--text-muted); }
    .loading-filename {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--slate-100); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 12px; margin-top: 10px;
      font-size: 12px; font-weight: 600; color: var(--text-primary);
    }
    .loading-filename svg { width: 13px; height: 13px; color: #EF4444; }

    /* Progress bar */
    .progress-section { width: 100%; }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 7px;
    }
    .progress-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .progress-pct { font-size: 12px; font-weight: 700; color: var(--primary-teal); }

    .progress-bar {
      height: 7px; background: var(--primary-light);
      border-radius: 99px; overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; width: 72%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-teal) 100%);
      border-radius: 99px;
      position: relative;
    }
    /* shimmer effect (static visual) */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 40px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      border-radius: 99px;
    }

    .progress-steps {
      display: flex; justify-content: space-between; margin-top: 10px;
    }
    .step {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 500;
    }
    .step-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .step.done .step-dot { background: var(--primary); }
    .step.done { color: var(--primary); }
    .step.active .step-dot { background: var(--primary-teal); box-shadow: 0 0 0 3px rgba(20,184,166,0.25); }
    .step.active { color: var(--primary-teal); font-weight: 700; }
    .step.pending .step-dot { background: var(--border); }
    .step.pending { color: var(--text-muted); }

    /* Footer */
    .modal-footer {
      padding: 12px 20px 16px; border-top: 1px solid var(--border);
      display: flex; justify-content: center;
    }
    .cancel-link {
      font-size: 13px; color: var(--text-muted); cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </div>
    <span class="logo-text">DocVault</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      All Documents
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Folders
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Expiring Soon
      <span class="badge">3</span>
    </div>
  </nav>
  <div class="sidebar-storage">
    <div class="storage-label"><span>Storage</span><span>1.9 / 5 GB</span></div>
    <div class="storage-bar"><div class="storage-bar-fill"></div></div>
  </div>
  <div class="sidebar-user">
    <div class="avatar">AT</div>
    <div><div class="user-name">Angelica T.</div><div class="user-role">Personal account</div></div>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <header class="topbar">
    <div class="topbar-greeting">Good morning, <span>Angelica</span> 👋</div>
  </header>
  <div class="bg-content"><div class="bg-zone"></div></div>

  <!-- Overlay + Loading modal -->
  <div class="overlay">
    <div class="modal">

      <div class="modal-header">
        <span class="modal-title">Saving document…</span>
        <div class="close-btn-disabled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
      </div>

      <div class="modal-body">

        <!-- Spinner -->
        <div class="spinner-wrap">
          <div class="spinner-track"></div>
          <div class="spinner-arc"></div>
          <div class="spinner-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
        </div>

        <!-- Text -->
        <div class="loading-info">
          <div class="loading-title">Uploading your document</div>
          <div class="loading-sub">Please wait, this won't take long</div>
          <div class="loading-filename">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Passport_Scan_2024.pdf
          </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <div class="progress-meta">
            <span class="progress-label">Uploading…</span>
            <span class="progress-pct">72%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="progress-steps">
            <div class="step done">
              <div class="step-dot"></div>
              Validating
            </div>
            <div class="step active">
              <div class="step-dot"></div>
              Uploading
            </div>
            <div class="step pending">
              <div class="step-dot"></div>
              Indexing
            </div>
            <div class="step pending">
              <div class="step-dot"></div>
              Saved
            </div>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <span class="cancel-link">Cancel upload</span>
      </div>

    </div>
  </div>
</div>

</body>
</html>
