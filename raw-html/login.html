<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DocVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    :root {
      --primary: #0F766E;
      --primary-teal: #14B8A6;
      --primary-light: #CCFBF1;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --sidebar: #1E293B;
      --text-primary: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
      --success: #16A34A;
      --slate-100: #F1F5F9;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .subtitle a {
      color: var(--text-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
    }

    .subtitle a:hover {
      color: var(--primary);
    }

    form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .label-row label {
      margin-bottom: 0;
    }

    .forgot-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 400;
    }

    .forgot-link:hover {
      color: var(--text-primary);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--primary-teal);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.12);
    }

    input::placeholder {
      color: #94A3B8;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-primary {
      background: var(--sidebar);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 3C4.44772 3 4 3.44772 4 4V16C4 16.5523 4.44772 17 5 17H15C15.5523 17 16 16.5523 16 16V7.41421C16 7.14899 15.8946 6.89464 15.7071 6.70711L12.2929 3.29289C12.1054 3.10536 11.8511 3 11.5858 3H5Z" fill="white" fill-opacity="0.9"/>
        <path d="M12 3.5V7H15.5" stroke="white" stroke-opacity="0.5" stroke-width="1" fill="none"/>
        <line x1="7" y1="10" x2="13" y2="10" stroke="white" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="7" y1="13" x2="11" y2="13" stroke="white" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Welcome to DocVault</h1>
    <p class="subtitle">Don't have an account? <a href="register.html">Sign up</a></p>

    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="m@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p class="footer-note">
      By clicking continue, you agree to our terms of use.
    </p>
  </div>
</body>
</html>
